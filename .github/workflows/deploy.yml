name: CI + Deploy

# Push to main: test → build multi-arch images → push to GHCR → ping the Pi,
# which only pulls and restarts. The Pi never builds anything.
# Pull requests: tests only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend build, vet, test
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend install
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck, lint, test, build
        run: |
          npx tsc --noEmit -p frontend
          npm run lint
          npm run test:frontend
          npm run build

  build:
    # Images only on pushes to main, and only if tests passed.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - name: infosec
            context: ./infosec-api
            dockerfile: ./infosec-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # arm64 for 64-bit Pi OS, arm/v7 for 32-bit — the Pi pulls whichever
          # matches. Build stages are pinned to BUILDPLATFORM so nothing
          # compiles under QEMU.
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pi deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"${{ github.ref }}","repository":"${{ github.repository }}","pusher":"${{ github.actor }}","sha":"${{ github.sha }}"}'

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            --max-time 10 \
            --retry 2 || echo "Warning: webhook delivery failed — run deploy.sh on the Pi manually"

          echo "✓ Deployment webhook sent"
