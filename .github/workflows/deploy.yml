name: CI + Deploy

# Push to main: test → build multi-arch images → push to GHCR → ping the VPS,
# which only pulls and restarts. The VPS never builds anything.
# Pull requests: tests only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend build, vet, test
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Frontend install
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck, lint, test, build
        run: |
          npx tsc --noEmit -p frontend
          npm run lint
          npm run test:frontend
          npm run build

  build:
    # Images only on pushes to main, and only if tests passed.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - name: infosec
            context: ./infosec-api
            dockerfile: ./infosec-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # arm64 for 64-bit Pi OS, arm/v7 for 32-bit, amd64 so the same
          # images run on any x86 cloud VM if hosting ever moves off the Pi.
          # Build stages are pinned to BUILDPLATFORM so nothing compiles
          # under QEMU.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.vps from secrets
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          BUDGET_DOMAIN: ${{ secrets.BUDGET_DOMAIN }}
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}
          PLAID_IMPORT_START: ${{ secrets.PLAID_IMPORT_START }}
          USCIS_CASE_URL: ${{ secrets.USCIS_CASE_URL }}
          USCIS_COOKIE: ${{ secrets.USCIS_COOKIE }}
          USCIS_BEARER: ${{ secrets.USCIS_BEARER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          cat > .env.vps <<'EOF'
          SITE_DOMAIN=${{ env.SITE_DOMAIN }}
          BUDGET_DOMAIN=${{ env.BUDGET_DOMAIN }}
          TAILSCALE_IP=${{ env.TAILSCALE_IP }}
          ACME_EMAIL=${{ env.ACME_EMAIL }}
          ADMIN_SECRET=${{ env.ADMIN_SECRET }}
          TURSO_DATABASE_URL=${{ env.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN=${{ env.TURSO_AUTH_TOKEN }}
          BACKUP_TOKEN=${{ env.BACKUP_TOKEN }}
          PLAID_CLIENT_ID=${{ env.PLAID_CLIENT_ID }}
          PLAID_SECRET=${{ env.PLAID_SECRET }}
          PLAID_ENV=${{ env.PLAID_ENV }}
          PLAID_IMPORT_START=${{ env.PLAID_IMPORT_START }}
          USCIS_CASE_URL=${{ env.USCIS_CASE_URL }}
          USCIS_COOKIE=${{ env.USCIS_COOKIE }}
          USCIS_BEARER=${{ env.USCIS_BEARER }}
          NTFY_TOPIC=${{ env.NTFY_TOPIC }}
          NTFY_TOKEN=${{ env.NTFY_TOKEN }}
          WEB_ROOT=/srv
          API_HOST=backend
          API_PORT=8080
          INFOSEC_HOST=infosec
          INFOSEC_PORT=5000
          EOF

      - name: Copy .env.vps to VPS via SCP
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            .env.vps ${VPS_USER}@${VPS_HOST}:~/darth-forge/.env.vps
          rm ~/.ssh/vps_key

      - name: Trigger VPS deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL_VPS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET_VPS }}
        run: |
          PAYLOAD='{"ref":"${{ github.ref }}","repository":"${{ github.repository }}","pusher":"${{ github.actor }}","sha":"${{ github.sha }}"}'

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            --max-time 10 \
            --retry 2 || echo "Warning: webhook delivery failed — run scripts/deploy-vps.sh on the VPS manually"

          echo "✓ Deployment webhook sent"
